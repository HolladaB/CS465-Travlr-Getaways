name: Verify
on:
  push:
    branches: [final]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app_admin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm ci
        working-directory: app_admin
      - run: npm run build
        working-directory: app_admin
